[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brink-flair-modbus"
version = "0.1.0"
description = "Read and control Brink Flair ventilation units over Modbus"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Yorick Smilda" }]
keywords = ["brink", "flair", "home-assistant", "modbus", "ventilation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = ["modbus-connection>=4.12,<5"]

[project.urls]
Repository = "https://github.com/ysmilda/brink-flair-modbus"
Issues = "https://github.com/ysmilda/brink-flair-modbus/issues"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brink_flair_modbus"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D", "PL"]
ignore = ["D203", "D213", "PLR2004", "PLR0913", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
